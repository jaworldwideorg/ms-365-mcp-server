name: JA build and deploy
on:
  push:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: 'Exact commit to build (daily sync supplies the tested merge SHA)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ja-softeria-deployment
  cancel-in-progress: false
jobs:
  build-deploy:
    if: github.repository == 'jaworldwideorg/ms-365-mcp-server'
    runs-on: ubuntu-latest
    environment: aca-test
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify source and build
        run: bash ci/check.sh
      - name: Verify hybrid schema budget
        run: node ci/check-hybrid.mjs
      - name: Resolve immutable image tag
        id: image
        run: echo "tag=${{ vars.ACR_LOGIN_SERVER }}/${{ vars.ACR_IMAGE_NAME }}:sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push verified artifact
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: ${{ steps.image.outputs.tag }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy digest and hybrid configuration
        env:
          DEPLOY_IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.ACR_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          ACA_APP_NAME: ${{ vars.ACA_APP_NAME }}
          ACA_RESOURCE_GROUP: ${{ vars.ACA_RESOURCE_GROUP }}
        run: bash ci/deploy.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-evidence-${{ github.run_id }}
          path: |
            generation.log
            deployment-evidence.json
